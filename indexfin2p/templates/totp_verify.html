{% extends 'base.html' %}
{% block title %}Verificação em duas etapas | IndexFin{% endblock %}
{% block content %}
  <div class="login-shell">
    <section class="login-card">
      <h1>Verificação em duas etapas</h1>
      <p class="muted">Digite o código atual do seu aplicativo autenticador para continuar.</p>
      {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" class="row g-3">
        <div class="col-12">
          <label for="code">Código de 6 dígitos</label>
          <input id="code" name="code" class="form-control" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,8}" minlength="6" maxlength="8" required autofocus>
        </div>
        <div class="col-12">
          <button class="btn btn-primary w-100" type="submit">Verificar e entrar</button>
        </div>
      </form>
    </section>
  </div>
{% endblock %}
